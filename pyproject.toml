[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-programming-rl-demo"
version = "0.1.0"
description = "A simple reinforcement learning demo showing dynamic programming concepts"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
